{% if languages %}
    <div class="row g-3">
        {% for language in languages %}
            <div class="col-md-6">
                <input
                    type="checkbox"
                    class="btn-check {{ input_class|default('') }}"
                    name="language_ids"
                    id="language-{{ language.id }}"
                    value="{{ language.id }}"
                    {% if input_disabled|default(false) %}disabled{% endif %}
                    {% if language.id in selected_language_ids|default([]) %}checked{% endif %}
                >

                <label class="btn pick-card border w-100 h-100 rounded-4 p-3 text-start" for="language-{{ language.id }}">
                    <span class="d-flex align-items-center justify-content-between gap-3">
                        <span>
                            <span class="fw-bold d-block">{{ language.name }}</span>
                            <span class="small text-body-secondary">{{ language.label|default('Tour language') }}</span>
                        </span>

                        <i class="bi bi-check-circle fs-5 ub-text"></i>
                    </span>
                </label>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-light border rounded-4 mb-0">
        No languages available yet.
    </div>
{% endif %}
