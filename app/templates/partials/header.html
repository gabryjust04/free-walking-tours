<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('public.home') }}">
            <i class="bi bi-signpost-2-fill text-brand"></i>
            UrbanBuddy
        </a>

        <button 
            class="navbar-toggler" 
            type="button" 
            data-bs-toggle="collapse" 
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {{ 'active' if request.endpoint == 'public.home' else '' }}" href="{{ url_for('public.home') }}">Tours</a>
                </li>

                {% if current_user.is_authenticated and current_user.role == "guide" %}
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'guide_dashboard.dashboard' else '' }}" href="{{ url_for('guide_dashboard.dashboard') }}">Dashboard</a>
                    </li>
                {% endif %}
            </ul>

            <div class="d-flex align-items-center gap-2">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('auth.profile') }}" class="btn btn-primary btn-sm">
                        Profile
                    </a>

                    <a href="{{ url_for('auth.logout') }}" class="btn btn-link btn-sm text-dark text-decoration-none">
                        Logout
                    </a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link btn-sm text-dark text-decoration-none">
                        Sign In
                    </a>

                    <a href="{{ url_for('auth.signup') }}" class="btn btn-primary btn-sm">
                        Register
                    </a>
