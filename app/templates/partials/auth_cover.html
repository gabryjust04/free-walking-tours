<aside class="position-relative h-100 bg-dark overflow-hidden">
    <img
        src="{{ url_for('static', filename='img/auth-cover.jpg') }}"
        alt="UrbanBuddy {{ city_name|default('Stockholm') }}"
        class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover"
    >

    <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-50"></div>

    <div class="position-relative z-1 h-100 d-flex flex-column p-4">
        <a class="navbar-brand fw-black d-inline-flex align-items-center gap-2 text-white mb-auto" href="{{ url_for('public.home') }}">
            <i class="bi bi-signpost-2-fill"></i>
            UrbanBuddy
        </a>

        <div>
            <span class="badge rounded-pill ub-badge mb-3">
                {{ city_name|default('Stockholm') }} walking tours
            </span>

            <h2 class="fw-black text-white mb-2">
                {{ cover_title|default("Let's walk together.") }}
            </h2>

            <p class="text-white-50 mb-0">
                {{ cover_text|default('Discover authentic city stories with local guides.') }}
            </p>
        </div>
    </div>
</aside>
