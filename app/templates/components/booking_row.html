<article class="border rounded-4 bg-body-tertiary p-3">
    <div class="row align-items-center g-3">
        <div class="col-auto">
            <div class="bg-white border rounded-3 text-center px-3 py-2">
                <div class="small fw-bold ub-text text-uppercase lh-1">
                    {{ event.date_month }}
                </div>

                <div class="h4 fw-black lh-1 mt-1 mb-0">
                    {{ event.date_day }}
                </div>
            </div>
        </div>

        <div class="col">
            <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                <span class="badge rounded-pill ub-badge-soft">
                    {{ event.theme }}
                </span>

                <span class="badge rounded-pill {{ event.status_class }}">
                    {{ event.status_label }}
                </span>

                <span class="small text-body-secondary">
                    <i class="bi bi-clock me-1"></i>{{ event.time_range }}
                </span>
            </div>

            <h3 class="h6 fw-black mb-1">
                {{ event.title }}
            </h3>

            <p class="small text-body-secondary mb-0">
                {{ event.participants }} participants · Starting at {{ event.meeting_point }}
            </p>
        </div>

        <div class="col-auto">
            <a
                href="{{ url_for('guide_dashboard.event_detail', event_id=event.id) }}"
                class="btn btn-light btn-sm fw-semibold"
            >
                Details
            </a>
        </div>
    </div>
</article>
